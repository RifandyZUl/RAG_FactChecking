# Tema demo pemeriksa klaim. Satu-satunya tempat kode warna heks.
# Pemetaan status -> nama warna ("red", "orange", ...) ada di src/presentation.py.

[theme]
# Terang dipaksa agar semantik warna status sama di semua perangkat.
base = "light"

# Palet berkas acuan (mockup desain dari pemilik proyek, 2026-10-22; tidak disimpan di repositori). Warna pendukung tanpa slot tema ada di
# src/ui/style.css; warna di bawah diteruskan ke CSS sebagai --theme-* oleh ui/components.py.
# Aksen tunggal: biru (tombol Periksa, tautan, fokus input).
primaryColor = "#1F4E9E"
linkColor = "#1F4E9E"

# Skala netral.
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#F2F4F7"
textColor = "#14213D"
borderColor = "#D0D5DD"

# Satu keluarga huruf: IBM Plex Sans (400 isi, 600 judul/tebal).
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
baseFontSize = 17
baseFontWeight = 400
# h1 = judul halaman (24px), h2 = status (28px, paling menonjol), h3 = subjudul (18px).
headingFontSizes = ["24px", "28px", "18px"]
headingFontWeights = [600, 600, 600]

# Warna status (intensitas menurun): PENIPUAN > SALAH > PARODI; "belum ditemukan" netral.
redColor = "#8F1D1D"
redTextColor = "#8F1D1D"
redBackgroundColor = "#FBEFEF"
orangeColor = "#9A4A0B"
orangeTextColor = "#9A4A0B"
orangeBackgroundColor = "#FBF3EA"
yellowColor = "#6E5A12"
yellowTextColor = "#6E5A12"
yellowBackgroundColor = "#F8F5E6"
grayColor = "#5B6168"
grayTextColor = "#5B6168"
grayBackgroundColor = "#F0F1EE"
# "Belum terbukti": di luar skala bahaya (merah/jingga/kuning), bukan netral (abu-abu), bukan hijau
# (terkesan "benar"), bukan biru (aksen). Kontras teks pada latar halaman 7,5:1 (AA; uji test_theme.py).
violetColor = "#6A3A9A"
violetTextColor = "#6A3A9A"
violetBackgroundColor = "#F5F0FA"

[client]
toolbarMode = "minimal"
# Pilihan paling ketat di Streamlit 1.64 (`streamlit config show`): browser hanya menampilkan pesan galat
# umum; jenis galat, pesan lengkap, dan traceback hanya ke konsol server.
showErrorDetails = "none"

[browser]
gatherUsageStats = false

[server]
# Tanpa pemantau berkas: pemantau menelusuri SEMUA modul termuat, termasuk submodul malas `transformers`,
# dan mengimpornya satu per satu (2026-10-22: 204 galat torchvision di log, skrip halaman tertahan).
# Demo tidak butuh muat-ulang otomatis saat kode disimpan; jalankan ulang server setelah mengubah kode.
fileWatcherType = "none"
